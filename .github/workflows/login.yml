name: Serv00/CT8 Login Tasks

on:
  workflow_dispatch:
  schedule:
    - cron: "14 13 */10 * *"  # 每月1号开始，每10天运行一次，运行时间为13:14
  # push:
  #   paths-ignore:
  #     - "LICENSE"
  #     - "README.md"
  #     - "README_**"
  #     - "README-**"
  #   branches:
  #     - main

env:
  ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:  
  login:  
    runs-on: ubuntu-latest  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4

      - name: Create accounts.json
        run: echo "$ACCOUNTS_JSON" > accounts.json
  
      - name: Set up Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: '20.x'  
  
      - name: Install dependencies  
        run: npm install puppeteer axios
  
      - name: Login into Serv00/CT8
        run: |  
          set -e  
          xvfb-run --server-args="-screen 0 1280x1024x24" node src/main.js

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh repository activity
        run: |
          now=$(date +%s)
          last=$(git log -1 --format=%ct)
          age_days=$(( (now - last) / 86400 ))
          echo "Days since last commit: ${age_days}"
          if [ "${age_days}" -ge 50 ]; then
            echo "[keepalive] $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> keepalive.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.log
            git commit -m "chore: keepalive commit to keep scheduled workflows active"
            git push
            echo "Keepalive commit pushed."
          else
            echo "No keepalive commit needed yet."
          fi